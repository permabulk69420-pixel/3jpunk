<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#03050d" />
    <meta
      name="description"
      content="A standalone Quest 3 WebXR cyberpunk city prototype."
    />
    <title>3JPUNK — Rain District</title>
  </head>
  <body>
    <main id="app" aria-label="3JPUNK WebXR scene">
      <div id="viewport" aria-hidden="true"></div>

      <section id="intro" class="intro-panel">
        <div class="intro-topline">
          <span class="eyebrow">DISTRICT 03 · NIGHT CYCLE</span>
          <span id="weather-state" class="weather-state">RAIN / HEAVY</span>
        </div>
        <h1>3J<span>PUNK</span></h1>
        <p class="intro-copy">A wet street, four towers, and the beginning of a much larger city.</p>
        <div class="actions">
          <div id="vr-button-slot"></div>
          <button id="desktop-button" class="secondary-button" type="button">Explore on screen</button>
        </div>
        <div class="control-grid" aria-label="Controls">
          <div><kbd>LEFT STICK</kbd><span>move</span></div>
          <div><kbd>RIGHT STICK</kbd><span>smooth turn</span></div>
          <div><kbd>WASD</kbd><span>desktop move</span></div>
          <div><kbd>MOUSE</kbd><span>desktop look</span></div>
        </div>
      </section>

      <aside id="status" class="status-rail" aria-live="polite">
        <div class="status-mark">3J</div>
        <div>
          <span id="mode-label">STREET FEED</span>
          <strong id="status-label">INITIALISING DISTRICT</strong>
        </div>
      </aside>

      <button id="sound-toggle" class="corner-control" type="button" aria-pressed="false">
        AMBIENCE OFF
      </button>

      <div id="reticle" aria-hidden="true"></div>
      <div id="vignette" aria-hidden="true"></div>
      <div id="loading" aria-live="polite">
        <div class="loader-line"><i></i></div>
        <span>ASSEMBLING RAIN DISTRICT</span>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
